<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>부산 VR 여행</title>
    <meta name="description" content="부산 17개 명소를 지하철·버스로 여행하는 WebXR VR 앱 (Meta Quest · 휴대폰 · PC)" />
    <meta name="theme-color" content="#0b1b3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="부산 VR" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script>
      // Quest 몰입형 PWA(APK)로 실행되면 브라우저가 페이지 로드 직후 'sessiongranted' 를 보낸다.
      // 모듈 로딩보다 먼저 받아 두었다가 앱 준비가 끝나면 곧바로 VR로 진입한다.
      window.__xrGranted = false;
      if (navigator.xr && navigator.xr.addEventListener) {
        navigator.xr.addEventListener('sessiongranted', function () {
          window.__xrGranted = true;
          window.dispatchEvent(new Event('busan-xr-granted'));
        });
      }
    </script>
    <style>
      :root {
        --navy: #0b1b3a;
        --panel: rgba(9, 16, 38, 0.86);
        --line: rgba(127, 214, 255, 0.45);
        --accent: #4fd6ff;
        --fg: #f2f6ff;
        --muted: #9fb4dd;
        --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #050a1e; color: var(--fg); font-family: var(--font); overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ── 시작 화면 ── */
      #start {
        position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px;
        background: radial-gradient(120% 90% at 50% 20%, rgba(28, 47, 102, 0.55), rgba(5, 10, 30, 0.9));
        transition: opacity 0.4s ease;
      }
      #start.out { opacity: 0; pointer-events: none; }
      .card {
        width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 26px 24px 22px; border-radius: 24px;
        background: var(--panel); border: 1.5px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); text-align: center;
      }
      .card .eyebrow { display: inline-block; padding: 4px 14px; border-radius: 999px; background: var(--accent); color: #06122b; font-weight: 800; font-size: 13px; letter-spacing: 0.04em; }
      .card h1 { margin: 12px 0 6px; font-size: clamp(30px, 7vw, 44px); line-height: 1.15; letter-spacing: -0.02em; }
      .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .cta { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 14px; }
      .cta button { min-height: 58px; border-radius: 16px; border: 0; font-size: 19px; font-weight: 800; }
      #start-vr { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; }
      #start-2d { background: #fff; color: #0b1b3a; }
      .cta button:active { transform: scale(0.98); }
      .cta button:disabled { opacity: 0.6; }
      .help { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; text-align: left; }
      .help div { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); font-size: 12.5px; line-height: 1.5; color: #cfe0ff; }
      .help b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }
      #start-status { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }

      /* ── 하단 퀵 HUD (VR 진입 시 숨김) ── */
      #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      #hud-chip {
        position: absolute; left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); max-width: min(74vw, 460px);
        padding: 9px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); pointer-events: none;
      }
      #hud-chip-title { font-weight: 800; font-size: 16px; }
      #hud-chip-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
      #hud-bar {
        position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; gap: 6px; padding: 7px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line);
        max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none;
      }
      #hud-bar::-webkit-scrollbar { display: none; }
      #hud-bar button {
        flex: 0 0 auto; min-width: 58px; min-height: 54px; padding: 6px 10px; border-radius: 14px; border: 0; background: rgba(255, 255, 255, 0.08);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: #dbe7ff;
      }
      #hud-bar button .ico { font-size: 21px; line-height: 1; }
      #hud-bar button:active { background: rgba(255, 255, 255, 0.2); }
      #hud-bar button.on { background: var(--accent); color: #06122b; }
      #hud-bar #btn-vr { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; }
      #hud-bar #btn-skip { background: #e11d48; color: #fff; }
      #hud-subtitle, #hud-toast {
        position: absolute; left: 50%; transform: translate(-50%, 8px); max-width: min(92vw, 640px); padding: 10px 16px; border-radius: 14px;
        text-align: center; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
      }
      #hud-subtitle { bottom: calc(92px + env(safe-area-inset-bottom)); background: rgba(0, 0, 0, 0.72); font-size: 15.5px; line-height: 1.5; font-weight: 600; }
      #hud-toast { top: calc(70px + env(safe-area-inset-top)); background: #fff; color: #0b1b3a; font-size: 14px; font-weight: 800; }
      #hud-subtitle.show, #hud-toast.show { opacity: 1; transform: translate(-50%, 0); }
      #hud-sheet {
        position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 520px); max-height: min(62vh, 520px);
        display: flex; flex-direction: column; border-radius: 20px; background: rgba(9, 16, 38, 0.96); border: 1px solid var(--line); overflow: hidden;
      }
      #hud-sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-weight: 800; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      #hud-sheet-close { width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, 0.1); font-size: 16px; }
      #hud-sheet-list { overflow: auto; padding: 8px 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .sheet-region { grid-column: 1 / -1; margin-top: 8px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.03em; }
      .sheet-item { min-height: 46px; padding: 8px 10px; border-radius: 12px; border: 0; border-left: 4px solid; background: rgba(255, 255, 255, 0.07); text-align: left; font-size: 14px; font-weight: 700; }
      .sheet-item:active { background: rgba(255, 255, 255, 0.18); }
      @media (max-height: 420px) {
        #hud-bar button { min-height: 44px; }
        #hud-bar button .ico { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="start">
      <div class="card">
        <span class="eyebrow">BUSAN · WebXR</span>
        <h1>부산 VR 여행</h1>
        <p>5개 권역 17개 명소를 지하철과 시티투어 버스로 여행합니다.<br />Meta Quest · 휴대폰 · PC 어디서나 실행됩니다.</p>
        <div class="cta">
          <button id="start-vr" type="button" hidden>🥽 VR로 시작</button>
          <button id="start-2d" type="button">▶ 화면으로 시작</button>
        </div>
        <div class="help">
          <div><b>🥽 Meta Quest</b>트리거: 선택 · 스틱 앞으로/그립: 텔레포트 · 스틱 좌우: 회전 · A/X: 메뉴</div>
          <div><b>📱 휴대폰</b>드래그: 둘러보기 · 탭: 핀/하차벨 선택 · 🧭 자이로</div>
          <div><b>🖥 PC</b>마우스 드래그·휠 · WASD 이동 · 클릭: 선택</div>
        </div>
        <div id="start-status">불러오는 중…</div>
      </div>
    </div>

    <div id="hud" hidden>
      <div id="hud-chip" hidden>
        <div id="hud-chip-title"></div>
        <div id="hud-chip-sub"></div>
      </div>
      <div id="hud-toast" role="status"></div>
      <div id="hud-subtitle" aria-live="polite"></div>
      <div id="hud-sheet" hidden>
        <header><span>📍 명소 선택</span><button id="hud-sheet-close" type="button" aria-label="닫기">✕</button></header>
        <div id="hud-sheet-list"></div>
      </div>
      <nav id="hud-bar" aria-label="빠른 메뉴">
        <button id="btn-map" type="button" hidden><span class="ico">🗺</span>지도</button>
        <button id="btn-spots" type="button"><span class="ico">📍</span>명소</button>
        <button id="btn-subway" type="button"><span class="ico">🚇</span>지하철</button>
        <button id="btn-bus" type="button"><span class="ico">🚌</span>버스</button>
        <button id="btn-skip" type="button" hidden><span class="ico">⏭</span>건너뛰기</button>
        <button id="btn-gyro" type="button"><span class="ico">🧭</span>자이로</button>
        <button id="btn-vr" type="button" hidden><span class="ico">🥽</span>VR</button>
      </nav>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
