plugins { id 'com.android.application' }

// 서명 설정: lck-cards/keystore.properties (git에 올리지 않음) 가 있으면 release 서명에 사용
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'kr.lckcards.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.lckcards.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
