plugins { id 'com.android.application' }

android {
    namespace 'kr.alertblock'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.alertblock'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../alertblock.keystore')
            storePassword 'alertblock'
            keyAlias 'alertblock'
            keyPassword 'alertblock'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
