plugins { id 'com.android.application' }

android {
    namespace 'com.shwo.keepscreenon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shwo.keepscreenon'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('keepscreenon.keystore')
            storePassword 'keepscreenon'
            keyAlias 'keepscreenon'
            keyPassword 'keepscreenon'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
