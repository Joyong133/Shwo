<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>부산 VR 여행</title>
    <meta name="description" content="부산 17개 명소를 지하철·버스로 여행하는 WebXR VR 앱 (Meta Quest · 휴대폰 · PC)" />
    <meta name="theme-color" content="#0b1b3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="부산 VR" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script>
      // Quest 몰입형 PWA(APK)로 실행되면 브라우저가 페이지 로드 직후 'sessiongranted' 를 보낸다.
      // 모듈 로딩보다 먼저 받아 두었다가 앱 준비가 끝나면 곧바로 VR로 진입한다.
      window.__xrGranted = false;
      if (navigator.xr && navigator.xr.addEventListener) {
        navigator.xr.addEventListener('sessiongranted', function () {
          window.__xrGranted = true;
          window.dispatchEvent(new Event('busan-xr-granted'));
        });
      }
    </script>
    <style>:root{--navy:#0b1b3a;--panel:#091026db;--line:#7fd6ff73;--accent:#4fd6ff;--fg:#f2f6ff;--muted:#9fb4dd;--font:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{height:100%;color:var(--fg);font-family:var(--font);overscroll-behavior:none;background:#050a1e;margin:0;overflow:hidden}#app{position:fixed;top:0;bottom:0;left:0;right:0}#app canvas{touch-action:none;cursor:grab;width:100%;height:100%;display:block}button{font:inherit;color:inherit;cursor:pointer}#start{z-index:30;background:radial-gradient(120% 90% at 50% 20%,#1c2f668c,#050a1ee6);justify-content:center;align-items:center;padding:20px;transition:opacity .4s;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#start.out{opacity:0;pointer-events:none}.card{background:var(--panel);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(10px);text-align:center;border-radius:24px;width:min(560px,100%);max-height:100%;padding:26px 24px 22px;overflow:auto;box-shadow:0 20px 60px #00000080}.card .eyebrow{background:var(--accent);color:#06122b;letter-spacing:.04em;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:800;display:inline-block}.card h1{letter-spacing:-.02em;margin:12px 0 6px;font-size:clamp(30px,7vw,44px);line-height:1.15}.card p{color:var(--muted);margin:0 0 14px;font-size:15px;line-height:1.6}.cta{flex-direction:column;gap:10px;margin:18px 0 14px;display:flex}.cta button{border:0;border-radius:16px;min-height:58px;font-size:19px;font-weight:800}#start-vr{color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed)}#start-2d{color:#0b1b3a;background:#fff}.cta button:active{transform:scale(.98)}.cta button:disabled{opacity:.6}.help{text-align:left;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;display:grid}.help div{color:#cfe0ff;background:#ffffff0f;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}.help b{color:#fff;margin-bottom:2px;font-size:13px;display:block}#start-status{min-height:18px;color:var(--muted);margin-top:10px;font-size:12.5px}#hud{z-index:20;pointer-events:none;position:fixed;top:0;bottom:0;left:0;right:0}#hud>*{pointer-events:auto}#hud-chip{left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);pointer-events:none;border-radius:14px;max-width:min(74vw,460px);padding:9px 14px;position:absolute}#hud-chip-title{font-size:16px;font-weight:800}#hud-chip-sub{color:var(--muted);margin-top:1px;font-size:12.5px}#hud-bar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);scrollbar-width:none;border-radius:20px;gap:6px;max-width:calc(100vw - 16px);padding:7px;display:flex;position:absolute;overflow-x:auto;transform:translate(-50%)}#hud-bar::-webkit-scrollbar{display:none}#hud-bar button{color:#dbe7ff;background:#ffffff14;border:0;border-radius:14px;flex-direction:column;flex:none;justify-content:center;align-items:center;gap:2px;min-width:58px;min-height:54px;padding:6px 10px;font-size:11.5px;font-weight:700;display:flex}#hud-bar button .ico{font-size:21px;line-height:1}#hud-bar button:active{background:#fff3}#hud-bar button.on{background:var(--accent);color:#06122b}#hud-bar #btn-vr{color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed)}#hud-bar #btn-skip{color:#fff;background:#e11d48}#hud-subtitle,#hud-toast{text-align:center;opacity:0;pointer-events:none;border-radius:14px;max-width:min(92vw,640px);padding:10px 16px;transition:opacity .25s,transform .25s;position:absolute;left:50%;transform:translate(-50%,8px)}#hud-subtitle{bottom:calc(92px + env(safe-area-inset-bottom));background:#000000b8;font-size:15.5px;font-weight:600;line-height:1.5}#hud-toast{top:calc(70px + env(safe-area-inset-top));color:#0b1b3a;background:#fff;font-size:14px;font-weight:800}#hud-subtitle.show,#hud-toast.show{opacity:1;transform:translate(-50%)}#hud-sheet{left:50%;bottom:calc(86px + env(safe-area-inset-bottom));border:1px solid var(--line);background:#091026f5;border-radius:20px;flex-direction:column;width:min(94vw,520px);max-height:min(62vh,520px);display:flex;position:absolute;overflow:hidden;transform:translate(-50%)}#hud-sheet header{border-bottom:1px solid #ffffff1a;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;display:flex}#hud-sheet-close{background:#ffffff1a;border:0;border-radius:10px;width:36px;height:36px;font-size:16px}#hud-sheet-list{grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 14px;display:grid;overflow:auto}.sheet-region{letter-spacing:.03em;grid-column:1/-1;margin-top:8px;font-size:12.5px;font-weight:800}.sheet-item{text-align:left;background:#ffffff12;border:0;border-left:4px solid;border-radius:12px;min-height:46px;padding:8px 10px;font-size:14px;font-weight:700}.sheet-item:active{background:#ffffff2e}@media (max-height:420px){#hud-bar button{min-height:44px}#hud-bar button .ico{font-size:17px}}</style>
    <script type="module" crossorigin src="./assets/index-CuGPvWwZ.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <div id="start">
      <div class="card">
        <span class="eyebrow">BUSAN · WebXR</span>
        <h1>부산 VR 여행</h1>
        <p>5개 권역 17개 명소를 지하철과 시티투어 버스로 여행합니다.<br />Meta Quest · 휴대폰 · PC 어디서나 실행됩니다.</p>
        <div class="cta">
          <button id="start-vr" type="button" hidden>🥽 VR로 시작</button>
          <button id="start-2d" type="button">▶ 화면으로 시작</button>
        </div>
        <div class="help">
          <div><b>🥽 Meta Quest</b>트리거: 선택 · 스틱 앞으로/그립: 텔레포트 · 스틱 좌우: 회전 · A/X: 메뉴</div>
          <div><b>📱 휴대폰</b>드래그: 둘러보기 · 탭: 핀/하차벨 선택 · 🧭 자이로</div>
          <div><b>🖥 PC</b>마우스 드래그·휠 · WASD 이동 · 클릭: 선택</div>
        </div>
        <div id="start-status">불러오는 중…</div>
      </div>
    </div>

    <div id="hud" hidden>
      <div id="hud-chip" hidden>
        <div id="hud-chip-title"></div>
        <div id="hud-chip-sub"></div>
      </div>
      <div id="hud-toast" role="status"></div>
      <div id="hud-subtitle" aria-live="polite"></div>
      <div id="hud-sheet" hidden>
        <header><span>📍 명소 선택</span><button id="hud-sheet-close" type="button" aria-label="닫기">✕</button></header>
        <div id="hud-sheet-list"></div>
      </div>
      <nav id="hud-bar" aria-label="빠른 메뉴">
        <button id="btn-map" type="button" hidden><span class="ico">🗺</span>지도</button>
        <button id="btn-spots" type="button"><span class="ico">📍</span>명소</button>
        <button id="btn-subway" type="button"><span class="ico">🚇</span>지하철</button>
        <button id="btn-bus" type="button"><span class="ico">🚌</span>버스</button>
        <button id="btn-skip" type="button" hidden><span class="ico">⏭</span>건너뛰기</button>
        <button id="btn-gyro" type="button"><span class="ico">🧭</span>자이로</button>
        <button id="btn-vr" type="button" hidden><span class="ico">🥽</span>VR</button>
      </nav>
    </div>

  </body>
</html>
